<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wondershare Official Software Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .hero-container {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: floatIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Official Logo Style */
        .brand-logo {
            width: 170px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 201, 167, 0.2);
            border: 1px solid rgba(0, 201, 167, 0.5);
            color: #00f2c3;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .glass-card h1 {
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .glass-card p {
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .cta-btn {
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00c9a7 0%, #0081a7 100%);
            box-shadow: 0 6px 20px rgba(0, 201, 167, 0.4);
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: all 0.6s ease;
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 201, 167, 0.6);
        }

        .cta-btn:active {
            transform: translateY(-1px);
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
            }
            .brand-logo {
                width: 140px;
            }
            .glass-card h1 {
                font-size: 1.4rem;
            }
            .cta-btn {
                padding: 14px 24px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="glass-card">
            <!-- Wondershare Official White Logo -->
                        
            <br>
            <span class="badge">Official Software Suite</span>
            <h1>A New Era of Creativity Belongs to the Creators</h1>
            <p>Power your creativity, productivity, and utility with Wondershare—featuring Filmora, PDFelement, Recoverit, Dr.Fone, and UniConverter all in one place!</p>
            
            <a href="https://www.tkqlhce.com/click-101843645-10890849" class="cta-btn" target="_blank" rel="noopener">Explore All Wondershare Deals &rarr;</a>
        </div>
    </div>

</body>
</html>
